<!DOCTYPE html>
<html>

<head>
  <style>
    div {
      border: 1px solid black;
      margin: 25px 25px 25px 25px;
      background-color: lightblue;
      text-align: center;
    }

    p {
      margin-bottom: inherit;
    }
  </style>
</head>

<body>
  <h2>Exemplo de margem</h2>
  <div>
    <p>Laboratório de CSS - Aprendendo o uso de margem.</p>
  </div>
</body>

</html>
