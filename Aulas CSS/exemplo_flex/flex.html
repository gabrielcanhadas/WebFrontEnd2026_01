<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Exemplo</title>
    <link rel="stylesheet" href="flex.css">
</head>
<body>

    <div class="container">
        <div class="texto">
            <h1>Bem-vindo!</h1>
            <p>Este é um exemplo simples usando Flexbox onde o texto fica na parte superior e a imagem na parte inferior da página.</p>
        </div>

        <div class="imagem">
            <img src="https://picsum.photos/600/300" alt="Imagem exemplo">
        </div>
    </div>

</body>
</html>
