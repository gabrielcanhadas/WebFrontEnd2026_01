<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 2</title>

  <body>
    <h1>HTML DOM Events</h1>
    <p>Informe uma frase usando somente letras:</p>

    <input type="text" id="entrada_dados" placeholder="Digite apenas letras" />
    <p id="demo"></p>
    <p id="pos_mouse"></p>

    <p>Use os atalhos para mudar a cor!</p>
    <ul>
      <li><b>B</b> : Branco</li>
      <li><b>Shift + C</b> : Cinza</li>
      <li><b>Ctrl + A</b> : Azul</li>
      <li><b>Alt + V</b> : Verde</li>
      <li><b>Ctrl + Shift + R</b> : Resetar</li>
    </ul>

    <footer id="rodape">Aguardando um atalho...</footer>
    <script src="../js/exemplo01.js"></script>
  </body>
