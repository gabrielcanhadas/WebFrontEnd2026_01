<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <h1>Local Storage</h1>
    <nav class="navbar">
      <div class="container">
        <ul>
          <li><a onclick="exportarDados()">Backup</a></li>
          <li><a onclick="document.getElementById('fileInput').click()">Restaurar</a></li>
        </ul>
      </div>
    </nav>
    <!-- input escondido continua existindo -->
    <input
      type="file"
      id="fileInput"
      accept=".json"
      style="display: none"
      onchange="importarDados(this.files[0])"
    />
    <div class="container">
      <div class="login">
        <form name="form-login">
          <h1>CADASTRO</h1>
          <label for="name">Email</label>
          <input type="email" id="name" placeholder="Email" required />
          <label for="pw">Senha</label>
          <input type="password" id="pw" placeholder="Senha" required />
          <ul class="helper-text">
            <li class="length">Deve conter até 8 caracteres.</li>
            <li class="lowercase">Deve conter ao menos uma letra minuscula.</li>
            <li class="uppercase">Deve conter ao menos uma letra maiuscula.</li>
          </ul>
          <input id="rgstr_btn" type="submit" value="Cadastrar" onclick="store()" />
        </form>
      </div>

      <div class="login">
        <form name="form-login">
          <h1>LOGIN</h1>
          <label for="userName">Email</label>
          <input type="email" id="userName" placeholder="Email" required />
          <label for="userPw">Senha</label>
          <input type="password" id="userPw" placeholder="Senha" required />
          <input id="login_btn" type="submit" value="Login" onclick="check()" />
        </form>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
