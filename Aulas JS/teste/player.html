<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Player 360</title>

    <!-- Video.js -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>

    <!-- Plugin 360 -->
    <script src="https://unpkg.com/videojs-panorama/dist/videojs-panorama.v5.min.js"></script>

    <style>
      body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .video-js {
        width: 90%;
        max-width: 1000px;
        height: 500px;
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <video id="video360" class="video-js vjs-default-skin" controls autoplay muted>
      <source src="../teste/video_injected.MP4" type="video/mp4" />
    </video>

    <script>
      var player = videojs("video360");

      player.panorama({
        clickAndDrag: true,
        autoMobileOrientation: true,
        backToVerticalCenter: false,
      });
    </script>
  </body>
</html>
